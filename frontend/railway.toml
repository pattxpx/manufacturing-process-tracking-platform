# Railway "config as code" for the FRONTEND service (root directory: frontend).
# Prepared from Railway's documented settings. It has NOT been run on Railway (see README, section 13).
# BACKEND_URL and NEXT_PUBLIC_WS_URL must exist as service variables BEFORE the build: Next.js bakes them in.

[build]
buildCommand = "npm run build"

[deploy]
startCommand = "npx next start -H 0.0.0.0"   # listens on $PORT, which Railway provides
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
