# Railway "config as code" for the BACKEND service (root directory: backend).
# Prepared from Railway's documented settings. It has NOT been run on Railway (see README, section 13).
# Variables (DATABASE_URL, ALLOWED_ORIGINS, ...) are set in the Railway dashboard, never in this file.

[deploy]
# No --proxy-headers / FORWARDED_ALLOW_IPS: client addresses are resolved by the app itself (TRUSTED_PROXY_HOPS).
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header"
# The health check also needs "healthcheck.railway.app" in ALLOWED_HOSTS.
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
